<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Profile - CluP</title>
  <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

<header class="navbar">
  <div class="logo">Cl<span>UP</span></div>
  <nav class="nav-links">
    <a href="home.html">Home</a>
    <a href="profile.html">Profile</a>
  </nav>
</header>

<section class="page-note">
  <p><strong>Προφίλ Χρήστη:</strong> Προβολή και επεξεργασία στοιχείων χρήστη.</p>
</section>

<main class="profile-wrap">

  <aside class="card" id="profile-card">
    <div class="card-content">
      <h3 id="profileName">Όνομα Επώνυμο</h3>
      <p><strong>Email:</strong> user@mail.com</p>
      <p><strong>Role:</strong> user</p>
      <p><strong>Interests:</strong> Music, Tech</p>
      <p><strong>Bio:</strong> Σύντομη περιγραφή...</p>
    </div>
  </aside>

  <section class="card">
    <div class="card-content">
      <h3>Edit Profile</h3>

      <form id="profile-form">

        <label>Όνομα</label>
        <input id="name" type="text">

        <label>Επώνυμο</label>
        <input id="lastname" type="text">

        <label>Email</label>
        <input id="email" type="email">

        <label>Bio</label>
        <textarea id="bio" rows="3"></textarea>

        <label>Interests</label>
        <input id="interests" type="text">

        <button type="button" class="primary-btn" id="save-profile">Save</button>

      </form>
    </div>
  </section>

</main>

<footer>
  <p>CluP — University Community Platform</p>
</footer>

<script src="../connection_f_b/api.js" defer></script>
</body>
</html>
