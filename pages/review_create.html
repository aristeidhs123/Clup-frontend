<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Create Review - CluP</title>
  <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

<header class="navbar">
  <div class="logo">Cl<span>UP</span></div>
  <nav class="nav-links">
    <a href="home.html">Home</a>
    <a href="reviews.html">Reviews</a>
  </nav>
</header>

<section class="page-note">
  <p><strong>Δημιουργία Αξιολόγησης:</strong> Επιλογή εκδήλωσης και συμπλήρωση φόρμας αξιολόγησης.</p>
</section>

<section class="section">
  <div class="card">
    <div class="card-content">

      <h3>Επιλογή Εκδήλωσης</h3>
      <select id="completedEvents" style="width:100%; padding:10px; border-radius:10px;">
        <option>Hackathon 2024</option>
        <option>Volunteer Day</option>
      </select>

      <h3 style="margin-top:20px;">Αξιολόγηση</h3>
      <input type="number" min="1" max="5" placeholder="Rating (1-5)" style="width:100%; padding:10px;">

      <textarea rows="4" placeholder="Write your review..." style="width:100%; padding:10px; margin-top:10px;"></textarea>

      <button class="primary-btn" style="margin-top:20px;">Submit Review</button>

    </div>
  </div>
</section>

<footer>
  <p>CluP — University Community Platform</p>
</footer>

<script src="../connection_f_b/api.js" defer></script>
</body>
</html>
